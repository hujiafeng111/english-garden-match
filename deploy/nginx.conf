# Replace example.com with the configured domain or server IP before use.
server {
    listen 80;
    server_name example.com;
    root /var/www/english-garden;
    index index.html;
    charset utf-8;
    location / { try_files $uri $uri/ =404; }
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location ~* \.(png|svg|css|js)$ { expires 1h; }
}
